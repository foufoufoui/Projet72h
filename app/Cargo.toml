[package]
name = "harpe-app"
version = "0.1.0"
edition = "2021"
description = "Application de réglage des sons de la harpe sans corde"

[dependencies]
eframe = "0.36"
rodio = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.17"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-core-foundation = "0.3"
objc2-foundation = "0.3"

[profile.release]
opt-level = 2
